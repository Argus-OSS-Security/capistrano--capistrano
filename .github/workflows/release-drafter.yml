name: Release Drafter

# Triggers intentionally disabled for Argus-OSS-Security.
# on:
#   push:
#     branches:
#       - master
# 
permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
